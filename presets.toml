status = "tested"
message = """Paid IQ3_XXS normal and refusal-projection runs on L4 with about 53 GiB host RAM,
32K context limit, int8 KV, GPU vision, direct PLE I/O and explicit --low-ram on.
Text, streaming, image/OCR and 1K/4K/24K nominal prompts passed; longest input 23,469 tokens.
Per-request projection disable was exercised. Not full-32K validation.
Source: Strata benchmark runs, 2026-10-06."""
