# ---------------------------------------------------------------------------------------------------------------
# Uncensored picks from Chinese X/forum write-ups, each measured by us on a Colab G4 (RTX PRO 6000 96 GB, 176 GB
# RAM) on 2026-11-20 with llama.cpp b12584 prebuilt, Xet high-performance download. gen = 700-token Chinese
# story; prefill = ~4.8K-token prompt. Uncensored check: raw-socket SYN scanner request answered with code.
# These models think at length by default: pass "chat_template_kwargs": {"enable_thinking": false} (GLM) /
# {"thinking": false} (DeepSeek) for direct answers, or give a large max_tokens.

[[preset]]
id = "qwen38-flash-next-sc117-abl-iq3s"
engine = "llamacpp"
label = "Qwen3.8-Flash-Next 无审查 IQ3_S（SC117，全显存，带视觉）"
repo = "SC117/Qwen3.8-Flash-Next-GSQ-RCO-abliterated-GGUF"
file = "IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-abliterated-IQ3_S-00001-of-00002.gguf"
mmproj = "mmproj-Qwen3.8-Flash-Next-BF16.gguf"
alias = "qwen3.8-flash-next-abliterated"
release = "b12584"
weights_gb = 83.9
licence = "Apache-2.0"
parallel = 4
# The 28.8 GB second shard is an n-gram table read lazily from mmap (crhywun/colab-llm 03_serve_flash_next).
prewarm = ["IQ3_S/Qwen3.8-Flash-Next-GSQ-RCO-abliterated-IQ3_S-00002-of-00002.gguf"]

[preset.gpu.G4]
mmproj_gpu = true
ctx = 262144
kv = "q8_0"
extra_args = ["-ngl", "99", "-fa", "on", "--kv-unified", "-b", "1024", "-ub", "512", "--cache-ram", "60000",
              "-lm", "mmap", "--lazy-mode", "on", "--temp", "1.0", "--top-p", "0.95", "--top-k", "20", "--min-p", "0"]

[preset.measured]
G4 = { gen_tps = 104.3, date = "2026-11-26", note = "实测：b12584，含视觉模块，VRAM 58.3 GiB；两张测试图全对" }

[[preset]]
id = "dsv41-flash-coder-abl-iq2xxs-engram"
engine = "llamacpp"
label = "DeepSeek-V4.1-Flash 748B Coder 无审查 IQ2_XXS + 完整 Engram（Abiray，带视觉）"
repo = "Abiray/DeepSeek-V4.1-Flash-1017-Uncensored-GSQ-RCO-Coder-GGUF"
file = "DeepSeek-V4.1-Flash-1017-Uncensored-GSQ-RCO-Coder-IQ2_XXS-00001-of-00006.gguf"
mmproj = "mmproj-DeepSeek-V4.1-Flash-1017-BF16.gguf"
alias = "deepseek-v4.1-flash-coder-uncensored"
release = "b12584"
# 72.1 GB backbone in VRAM + 110.6 GB Engram table memory-mapped from local disk and pre-read into page cache.
weights_gb = 72.1
licence = "MIT"
parallel = 2
links = { "DeepSeek-V4.1-Flash-1017-Uncensored-GSQ-RCO-Coder-IQ2_XXS-00006-of-00006.gguf" = "DeepSeek-V4.1-Flash-Engram-IQ4_NL.gguf" }
prewarm = ["DeepSeek-V4.1-Flash-Engram-IQ4_NL.gguf"]

[preset.gpu.G4]
mmproj_gpu = true
ctx = 524288  # 2026-11-23 measured on G4: 479,997-token prompt, 3/3 needles, prefill 211 tok/s (38 min), VRAM 78.4 GB at start
kv = "q8_0"
extra_args = ["-ngl", "99", "-fa", "on", "--kv-unified", "-b", "2048", "-ub", "512", "-t", "24", "--temp", "1.0", "--top-p", "0.95"]  # model-card sampling as server default

[preset.measured]
G4 = { gen_tps = 75.8, date = "2026-11-26", note = "实测：b12584，含视觉模块（与原版同一文件），VRAM 77.6 GiB，Engram 预读后；两张测试图全对" }

[[preset]]
id = "glm53-flash-huihui-abl-ud-iq2xxs"
engine = "llamacpp"
label = "GLM-5.3-Flash 321B 无审查 UD-IQ2_XXS（huihui，带视觉）"
repo = "huihui-ai/Huihui-GLM-5.3-Flash-abliterated-GGUF"
file = "UD-IQ2_XXS/GLM-5.3-Flash-UD-IQ2_XXS-00001-of-00004.gguf"
mmproj = "mmproj-model-bf16.gguf"
alias = "glm-5.3-flash-abliterated"
release = "b12584"
weights_gb = 101.8
licence = "MIT"
parallel = 2

[preset.gpu.G4]
mmproj_gpu = true
ctx = 524288  # 2026-11-23 measured on G4: 484,103-token prompt, 3/3 needles, prefill 671 tok/s (12 min), VRAM 96.5 of 97.9 GB; 262144 earlier: 242K 3/3, 92.8 GB
kv = "q8_0"
# 101.8 GB of weights: the experts of 8 layers stay in host RAM so the rest plus the 1.16 GB vision projector fit in 96 GB.
# With 6 layers (the text-only setting) the projector allocation fails with cudaMalloc out of memory (2026-11-26).
extra_args = ["-ngl", "99", "--n-cpu-moe", "8", "-fa", "on", "--kv-unified", "-b", "2048", "-ub", "512", "-t", "24", "--temp", "1.0", "--top-p", "0.95"]  # model-card sampling as server default

[preset.measured]
G4 = { gen_tps = 53.1, date = "2026-11-26", note = "实测：b12584，含视觉模块（--n-cpu-moe 8），VRAM 91.7 GiB；488,939-token 提示 3/3，预填充 572 tok/s；两张测试图全对。无视觉时 57.6 tok/s（2026-11-20）" }

